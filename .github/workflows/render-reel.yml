name: Render reel

on:
  workflow_dispatch:
    inputs:
      row_id:
        description: 'SDW Instagram Calendar row id'
        required: true
      n8n_base:
        description: 'n8n base URL, e.g. https://swaroopa.fagent.cloud'
        required: true
      voice:
        description: 'edge-tts voice'
        required: false
        default: 'en-IN-NeerjaNeural'

permissions:
  contents: write

concurrency:
  group: reel-${{ github.event.inputs.row_id }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --quiet edge-tts

      - name: Render reel
        env:
          ROW_ID: ${{ github.event.inputs.row_id }}
          POST_URL: ${{ github.event.inputs.n8n_base }}/webhook/sdw-post?id=${{ github.event.inputs.row_id }}
          SLIDE_BASE: ${{ github.event.inputs.n8n_base }}/webhook/sdw-slide
          VOICE: ${{ github.event.inputs.voice }}
        run: python3 render.py

      - name: Publish video (served by jsDelivr CDN as video/mp4)
        id: rel
        run: |
          SIZE=$(stat -c %s out/reel.mp4)
          if [ "$SIZE" -gt 18000000 ]; then
            ffmpeg -y -loglevel error -i out/reel.mp4 -c:v libx264 -preset veryfast -crf 27 -c:a copy -movflags +faststart out/small.mp4 && mv out/small.mp4 out/reel.mp4
          fi
          echo "::notice::reel size $(stat -c %s out/reel.mp4) bytes"
          NAME="reel-${{ github.event.inputs.row_id }}-${{ github.run_id }}.mp4"
          git config user.name "sdw-reels-bot"
          git config user.email "sdw-reels-bot@users.noreply.github.com"
          git fetch -q --depth 1 origin media || true
          if git rev-parse -q --verify origin/media >/dev/null; then
            git switch -q -c media origin/media
          else
            git switch -q --orphan media
          fi
          mkdir -p reels && cp out/reel.mp4 "reels/$NAME"
          git add "reels/$NAME" && git commit -qm "Add $NAME" && git push -q origin media
          echo "url=https://cdn.jsdelivr.net/gh/${{ github.repository }}@media/reels/$NAME" >> "$GITHUB_OUTPUT"

      - name: Tell n8n the reel is ready
        run: |
          curl -sS --retry 6 --retry-all-errors --retry-delay 10 --connect-timeout 20 -m 60 -X POST "${{ github.event.inputs.n8n_base }}/webhook/sdw-reel-ready" \
            -H 'Content-Type: application/json' \
            -d "{\"id\": ${{ github.event.inputs.row_id }}, \"url\": \"${{ steps.rel.outputs.url }}\", \"run\": \"${{ github.run_id }}\"}"

      - name: Tell n8n if it failed
        if: failure()
        run: |
          curl -sS --retry 6 --retry-all-errors --retry-delay 10 --connect-timeout 20 -m 60 -X POST "${{ github.event.inputs.n8n_base }}/webhook/sdw-reel-ready" \
            -H 'Content-Type: application/json' \
            -d "{\"id\": ${{ github.event.inputs.row_id }}, \"error\": \"Render failed - see GitHub Actions run ${{ github.run_id }}\"}"
