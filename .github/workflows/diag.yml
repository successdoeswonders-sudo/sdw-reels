name: Diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "::notice::dns $(getent ahosts swaroopa.fagent.cloud | awk '{print $1}' | sort -u | tr '\n' ' ')"
          echo "::notice::v4 $(curl -4 -sS -o /dev/null -w '%{http_code} %{time_total}' -m 20 'https://swaroopa.fagent.cloud/webhook/sdw-slide?id=6&n=1' 2>&1)"
          echo "::notice::v6 $(curl -6 -sS -o /dev/null -w '%{http_code} %{time_total}' -m 20 'https://swaroopa.fagent.cloud/webhook/sdw-slide?id=6&n=1' 2>&1)"
          echo "::notice::post $(curl -sS -m 20 'https://swaroopa.fagent.cloud/webhook/sdw-post?id=6' 2>&1 | head -c 120)"
